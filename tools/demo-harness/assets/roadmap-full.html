<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로드맵</title>
<link rel="stylesheet" href="/cards.css">
</head>
<body>
<main class="full">
  <h1>마무리 · 지금 보여 드릴 수 있는 것과, 아직 보여 드릴 수 없는 것</h1>
  <div class="split">
    <section class="box done" aria-labelledby="h-done">
      <h2 id="h-done">{{DONE_TITLE}}</h2>
      <ul class="{{DONE_CLASS}}">
        {{{DONE_ITEMS}}}
      </ul>
    </section>
    <section class="box road" aria-labelledby="h-road">
      <h2 id="h-road">로드맵 · 아직 보여 드릴 수 없음</h2>
      <ul id="road-list">
        {{{ROAD_ROWS}}}
      </ul>
    </section>
  </div>
  <section class="omit" aria-labelledby="h-omit">
    <h2 id="h-omit">이 PC 구성에서 생략한 장면</h2>
    <ul>{{{OMIT_LINES}}}</ul>
  </section>
  <p class="fixed">이 화면은 개발 상태 안내이며 출시 일정·성능을 약속하지 않습니다. 목록 순서는 우선순위와 무관합니다.</p>
</main>
</body>
</html>
