[project]
name = "ml-worker"
version = "0.1.0"
description = "Chat Bot NLU 1단계 — 추론 전용 문장 임베딩 서비스 (apps/ml-worker, ADR-0024)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "numpy>=2.2,<3.0",
  "sentence-transformers>=6.1,<7.0",
  "torch>=2.2,<3.0",
  # generator.py가 직접 import한다(이전에는 sentence-transformers 간접 의존). 검증 조합 5.17.
  "transformers>=5.17,<6.0",
  # GENERATION_BACKEND=ollama(dev-pipeline-validation, No.17 FR-NG2)의 HTTP 클라이언트.
  # 기본 backend(transformers)에서는 로드되지만 호출되지 않는다 — 가볍고(torch/transformers
  # 대비) 이미 dev 그룹에서 fastapi TestClient용으로 쓰이고 있어 실 런타임 의존성으로 승격한다.
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
]
# No.21 군집 품질 기준선(eval/clustering_baseline.py)용 — 제품 경로가 아니며 런타임 설치 목록은 그대로다.
# scikit-learn은 sentence-transformers의 간접 의존성으로 이미 설치돼 있으나(선언되지 않음), HDBSCAN 하한(1.3)을 문서화한다.
eval = [
  "scikit-learn>=1.3,<2",
]

# No.32 음성 인식(ML_WORKER_ROLE=speech, ADR-0052) — 기본 설치(embed)에는 들어가지 않는다(반입 부담 격리).
# faster-whisper가 CTranslate2·onnxruntime(Silero VAD)을 끌고 온다. av는 브라우저 녹음(WebM/Opus·MP4/AAC)을
# 메모리에서 디코딩한다. 검증 조합: faster-whisper 1.2.1 · av 17.1.0 · ctranslate2 4.8.2 (requirements-speech-lock.txt).
# 설치: pip install -c requirements-lock.txt -c requirements-speech-lock.txt -e ".[dev,speech]"
speech = [
  "faster-whisper>=1.1,<2.0",
  "av>=14,<18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
